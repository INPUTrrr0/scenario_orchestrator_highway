<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenario Provenance Tree</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
  :root {
    --bg: #12151c;
    --panel: #1c212c;
    --edge: #4a5568;
    --accent: #63b3ed;
    --text: #e2e8f0;
    --muted: #8a94a6;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 14px 22px; border-bottom: 1px solid #2a3040; display: flex;
    align-items: baseline; gap: 16px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .hint { color: var(--muted); font-size: 12.5px; }
  #viewport { width: 100%; overflow: auto; }
  #canvas { position: relative; margin: 0 auto; }
  svg#edges { position: absolute; top: 0; left: 0; pointer-events: none; }
  svg#edges path { stroke: var(--edge); stroke-width: 1.5; fill: none; }

  .node { position: absolute; width: var(--node-w); background: var(--panel);
    border: 1px solid #303849; border-radius: 10px; overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,.35); transition: border-color .15s; }
  .node:hover { border-color: var(--accent); }
  .node video { display: block; width: 100%; background: #000; }
  .node .bar { display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px; font-size: 12.5px; }
  .node .bar .label { font-weight: 600; }
  .node .bar .created { color: var(--muted); font-size: 11px; }
  .node .toggle { cursor: pointer; user-select: none; border: 1px solid #3a4457;
    background: #232a38; color: var(--text); border-radius: 6px; font-size: 11px;
    padding: 1px 7px; line-height: 1.5; }
  .node .toggle:hover { border-color: var(--accent); color: var(--accent); }
  .node .toggle.leaf { visibility: hidden; }
  #err { color: #feb2b2; padding: 20px 24px; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<header>
  <h1>Scenario Provenance Tree</h1>
  <span class="hint">Upside-down tree: root at top, descendants below. Click &plusmn; on a node to collapse/expand its subtree. All movies loop.</span>
</header>
<div id="err"></div>
<div id="viewport"><div id="canvas"><svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg></div></div>

<script>
"use strict";
/* Layout constants */
const NODE_W = 240, NODE_H_EST = 200, H_GAP = 26, V_GAP = 70, PAD = 30;
document.documentElement.style.setProperty("--node-w", NODE_W + "px");

const canvas = document.getElementById("canvas");
const edgesSvg = document.getElementById("edges");
const errBox = document.getElementById("err");

/* Embedded fallback provenance (in case fetch of the YAML is blocked by file://) */
const EMBEDDED_PROVENANCE = `versions:
- version: 1
  file: scenario_v1.yaml
  parent: null
  created: '2026-07-14T23:55:40'
- version: 2
  file: scenario_v2.yaml
  parent: 1
  created: '2026-07-15T01:11:59'
- version: 3
  file: scenario_v3.yaml
  parent: 2
  created: '2026-07-15T01:16:44'
- version: 4
  file: scenario_v4.yaml
  parent: 1
  created: '2026-07-15T02:40:01'
- version: 5
  file: scenario_v5.yaml
  parent: 4
  created: '2026-07-15T02:41:34'
- version: 6
  file: scenario_v6.yaml
  parent: 5
  created: '2026-07-15T02:46:02'
- version: 7
  file: scenario_v7.yaml
  parent: 6
  created: '2026-07-15T02:49:47'
- version: 8
  file: scenario_v8.yaml
  parent: 7
  created: '2026-07-15T02:53:11'
- version: 9
  file: scenario_v9.yaml
  parent: 8
  created: '2026-07-15T02:55:11'
- version: 10
  file: scenario_v10.yaml
  parent: 4
  created: '2026-07-15T02:59:05'
- version: 11
  file: scenario_v11.yaml
  parent: 10
  created: '2026-07-15T03:00:43'
- version: 12
  file: scenario_v12.yaml
  parent: 11
  created: '2026-07-15T03:09:52'
- version: 13
  file: scenario_v13.yaml
  parent: 12
  created: '2026-07-15T03:16:46'
- version: 14
  file: scenario_v14.yaml
  parent: 13
  created: '2026-07-15T03:17:58'
- version: 15
  file: scenario_v15.yaml
  parent: 14
  created: '2026-07-15T03:19:02'
- version: 16
  file: scenario_v16.yaml
  parent: 15
  created: '2026-07-15T03:20:59'
- version: 17
  file: scenario_v17.yaml
  parent: 16
  created: '2026-07-15T03:22:01'
- version: 18
  file: scenario_v18.yaml
  parent: 17
  created: '2026-07-15T03:27:18'
- version: 19
  file: scenario_v19.yaml
  parent: 18
  created: '2026-07-15T03:31:31'
- version: 20
  file: scenario_v20.yaml
  parent: 19
  created: '2026-07-15T03:36:15'
`;

const nodes = new Map();   // version -> {version, file, parent, created, children[], el, collapsed}
let roots = [];

function buildTree(prov) {
  for (const v of prov.versions) {
    nodes.set(v.version, { ...v, children: [], collapsed: false, el: null });
  }
  for (const n of nodes.values()) {
    if (n.parent != null && nodes.has(n.parent)) nodes.get(n.parent).children.push(n);
    else roots.push(n);
  }
  for (const n of nodes.values()) n.children.sort((a, b) => a.version - b.version);
  roots.sort((a, b) => a.version - b.version);
}

function makeNodeEl(n) {
  const el = document.createElement("div");
  el.className = "node";
  el.innerHTML = `
    <video muted autoplay loop playsinline preload="metadata"
           src="scenario_v${n.version}.mp4"></video>
    <div class="bar">
      <span class="label">v${n.version}</span>
      <span class="created">${(n.created || "").replace("T", " ")}</span>
      <button class="toggle ${n.children.length ? "" : "leaf"}" title="collapse/expand subtree">&minus;</button>
    </div>`;
  el.querySelector(".toggle").addEventListener("click", () => {
    n.collapsed = !n.collapsed;
    el.querySelector(".toggle").innerHTML = n.collapsed ? "+" : "&minus;";
    layout();
  });
  // Some browsers pause autoplay-off-screen videos; nudge on visibility.
  el.querySelector("video").addEventListener("loadeddata", e => e.target.play().catch(() => {}));
  canvas.appendChild(el);
  n.el = el;
  return el;
}

/* Tidy tree layout: post-order, leaves packed left-to-right, parents centered. */
function layout() {
  let cursorX = 0;
  const visible = [];

  function place(n, depth) {
    n.el.style.display = "";
    visible.push(n);
    n.depth = depth;
    const kids = n.collapsed ? [] : n.children;
    if (n.collapsed) n.children.forEach(hideSubtree);
    if (kids.length === 0) {
      n.x = cursorX;
      cursorX += NODE_W + H_GAP;
    } else {
      kids.forEach(k => place(k, depth + 1));
      n.x = (kids[0].x + kids[kids.length - 1].x) / 2;
    }
  }
  function hideSubtree(n) {
    n.el.style.display = "none";
    n.children.forEach(hideSubtree);
  }

  roots.forEach(r => place(r, 0));

  // Row heights: measure tallest node per depth (videos vary in aspect).
  const rowH = [];
  for (const n of visible) {
    const h = n.el.offsetHeight || NODE_H_EST;
    rowH[n.depth] = Math.max(rowH[n.depth] || 0, h);
  }
  const rowY = [];
  let y = PAD;
  for (let d = 0; d < rowH.length; d++) { rowY[d] = y; y += (rowH[d] || NODE_H_EST) + V_GAP; }

  let maxX = 0, maxY = 0;
  for (const n of visible) {
    n.px = n.x + PAD;
    n.py = rowY[n.depth];
    n.el.style.left = n.px + "px";
    n.el.style.top = n.py + "px";
    maxX = Math.max(maxX, n.px + NODE_W);
    maxY = Math.max(maxY, n.py + (n.el.offsetHeight || NODE_H_EST));
  }
  const W = maxX + PAD, H = maxY + PAD;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  edgesSvg.setAttribute("width", W);
  edgesSvg.setAttribute("height", H);

  // Edges: parent bottom-center -> child top-center, cubic curve.
  let d = "";
  for (const n of visible) {
    if (n.collapsed) continue;
    const ph = n.el.offsetHeight || NODE_H_EST;
    for (const c of n.children) {
      const x1 = n.px + NODE_W / 2, y1 = n.py + ph;
      const x2 = c.px + NODE_W / 2, y2 = c.py;
      const my = (y1 + y2) / 2;
      d += `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2} `;
    }
  }
  edgesSvg.innerHTML = `<path d="${d}"/>`;
}

async function loadProvenance() {
  try {
    const r = await fetch("../scenarios/provenance.yaml");
    if (r.ok) return jsyaml.load(await r.text());
  } catch (e) { /* fall through to embedded copy */ }
  return jsyaml.load(EMBEDDED_PROVENANCE);
}

loadProvenance().then(prov => {
  if (!prov || !prov.versions) throw new Error("provenance.yaml has no versions");
  buildTree(prov);
  // Create DOM in BFS order so tab order is sensible.
  const q = [...roots];
  while (q.length) { const n = q.shift(); makeNodeEl(n); q.push(...n.children); }
  layout();
  // Re-layout once videos know their sizes, and on resize.
  canvas.querySelectorAll("video").forEach(v =>
    v.addEventListener("loadedmetadata", () => layout(), { once: true }));
  setTimeout(layout, 800);
}).catch(e => {
  errBox.style.display = "block";
  errBox.textContent = "Failed to build tree: " + e.message;
});
</script>
</body>
</html>
