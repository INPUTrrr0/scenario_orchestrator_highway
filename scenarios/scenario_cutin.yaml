# Highway cut-in on a straight 3-lane road.
# Ego (green) cruises in the center lane. Actor (red) starts in the right
# lane ahead and lane-changes left into ego's path.
#
# Lanes (northbound, heading 90°): left x=-3.5, center x=0, right x=+3.5
#
# The actor carries a `cutin` spec that is *ego-relative at a fixed time*:
#   at t=..., complete the lane change `along` metres ahead of the ego
#   (and `lat` metres to its left).  If the ego's speed changes, the world
#   place of the cut-in moves with the ego, but the relative cut-off stays
#   the same.  Maneuvers are auto-generated by resolve_cutins().

map:
  kind: straight
  num_lanes: 3
  lane_width: 3.5
  length: 120

render:
  pixels_per_meter: 6

actors:
  # Ego — center lane, constant cruise
  - id: 0
    color: [90, 190, 110]
    length: 4.5
    width: 2.0
    start: {x: 0.0, y: -50.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 8.0, curve: {v0: 13.0, accel: 0.0}}

  # Cut-in candidate — right lane; plan solved from the cutin constraint below.
  # At t=3.0s, finish the merge 6 m ahead of wherever the ego is then
  # (~one car length; drag the pin closer if you want a tighter cut-off).
  # The orchestrator may RECAST the role: the `cutin` spec moves to whichever
  # actor scores best (adjacent lane, ~14 m ahead of the ego).  The green dot
  # in the orchestrator panel shows who holds it; everyone else cruises.
  - id: 1
    color: [210, 70, 60]
    length: 4.5
    width: 2.0
    start: {x: 3.5, y: -38.0, heading: 90}
    cutin: {t: 3.0, along: 6.0, lat: 0.0, lc_duration: 2.0, tail: 4.0}
    maneuvers: []

  # Nominal traffic — cruise straight unless the orchestrator casts them.
  - id: 2
    color: [80, 140, 220]
    length: 4.5
    width: 2.0
    start: {x: -3.5, y: -30.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 8.0, curve: {v0: 11.5, accel: 0.0}}

  - id: 3
    color: [240, 175, 65]
    length: 4.5
    width: 2.0
    start: {x: 3.5, y: -18.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 8.0, curve: {v0: 12.5, accel: 0.0}}

  - id: 4
    color: [170, 110, 220]
    length: 4.5
    width: 2.0
    start: {x: -3.5, y: -46.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 8.0, curve: {v0: 12.0, accel: 0.0}}
