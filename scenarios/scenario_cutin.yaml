# Highway cut-in on a straight 3-lane road.
# Ego (green) cruises in the center lane; the orchestrator casts one of the
# other actors as the cut-in (green dot in the orchestrator panel).
#
# Lanes (northbound, heading 90°): left x=-3.5, center x=0, right x=+3.5
#
# No hand-written movement segments for the ACTORS: each carries a `cruise`
# speed (m/s) and drives straight at it.  The cut-in holder's plan is solved
# from the `cutin` constraint; if the cut-in is unsuccessful (deadline `t`
# passes without a merge) the actor returns to its cruise speed and keeps
# going straight.
#
# The EGO carries a script with a sudden slowdown (13 -> 4 m/s at t=1.2s).
# Press Drive and keep hands off: the ego auto-follows this script, the pin
# falls behind actor 1 (it cannot brake enough to still make the cut-in by
# the deadline), and the orchestrator recasts the role to actor 4, which is
# approaching from behind in the left lane.
#
# The `cutin` spec is ego-relative at a fixed time: at t=..., complete the
# lane change `along` metres ahead of the ego (`lat` metres to its left).

map:
  kind: straight
  num_lanes: 3
  lane_width: 3.5
  length: 120

render:
  pixels_per_meter: 6

actors:
  # Ego — center lane; cruises at 13 then brakes hard to 4 m/s
  - id: 0
    color: [90, 190, 110]
    length: 4.5
    width: 2.0
    start: {x: 0.0, y: -50.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 1.2, curve: {v0: 13.0, accel: 0.0}}
      - {type: decelerate, duration: 1.5, curve: {v0: 13.0, accel: -6.0}}
      - {type: go_straight, duration: 5.3, curve: {v0: 4.0, accel: 0.0}}

  # Cut-in candidate — right lane, well ahead; holds the cutin spec at load.
  # When the ego brakes, the pin falls hopelessly far behind this actor and
  # the orchestrator recasts the role.
  - id: 1
    color: [210, 70, 60]
    length: 4.5
    width: 2.0
    start: {x: 3.5, y: -30.0, heading: 90}
    cruise: 12.0
    cutin: {t: 6.0, along: 6.0, lat: 0.0, lc_duration: 2.0, tail: 4.0}

  # Nominal traffic — cruise straight unless cast.
  - id: 2
    color: [80, 140, 220]
    length: 4.5
    width: 2.0
    start: {x: -3.5, y: -30.0, heading: 90}
    cruise: 11.5

  - id: 3
    color: [240, 175, 65]
    length: 4.5
    width: 2.0
    start: {x: 3.5, y: -18.0, heading: 90}
    cruise: 12.5

  # Approaching from behind the ego — takes the role when the ego brakes.
  - id: 4
    color: [170, 110, 220]
    length: 4.5
    width: 2.0
    start: {x: -3.5, y: -52.0, heading: 90}
    cruise: 12.0
  
