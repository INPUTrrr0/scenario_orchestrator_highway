# Highway cut-in on a straight 3-lane road, orchestrated by cutin_director.py.
#
# The same file drives the pygame editor (Drive mode: `scenario_editor.py
# scenarios/scenario_cutin_single.yaml`, then F) and the CARLA runner
# (`python -m carla_highway --scenario cutin --base <this file>`). Every value
# below can be overridden from either command line:
#
#   --trigger-time S   --trigger-ego-speed V   --gap M   --rel-speed DV
#   --static_commit | --re-aim   --lc-duration S   --num-actors N
#   --spawn-seed SEED  --traj-out / --trajectories PATH
#
# Lanes (northbound, heading 90): left x=-3.5, centre x=0, right x=+3.5.

map:
  kind: straight
  num_lanes: 3
  lane_width: 3.5
  length: 120

render:
  pixels_per_meter: 6

actors:
  # The ego, centre lane. In pygame Drive mode it follows this speed profile
  # until you press a key; a policy or you drive it everywhere else.
  - id: 0
    color: [90, 190, 110]
    length: 4.5
    width: 2.0
    start: {x: 0.0, y: -50.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 30.0, curve: {v0: 13.0, accel: 0.0}}

# ---- the cut-in --------------------------------------------------------------
cutin:
  # 1. when the cut-in is ALLOWED; every listed condition must hold. The
  #    actor starts its lane change at the first moment after that from which
  #    it can land the gap and relative speed below, and keeps getting ready
  #    until then. A speed condition must hold for > ego_speed_hold_s (1 s).
  trigger: {time_gt: 3.0}          # or {ego_speed_gt: 5.0}, or both
  # 2. ego FRONT bumper to actor REAR bumper at the cut-in instant -- the first
  #    moment any corner of the actor is inside the ego's lane
  gap_m: 0.5
  # 3. actor speed minus ego speed at that instant. Positive: it comes up
  #    faster and crosses the ego's nose. Negative: the ego closes on it.
  rel_speed_mps: -2.0
  # static_commit: the plan solved when the lane change starts runs as is, and the ego's
  #   response decides the outcome. re_aim: keeps re-aiming at the ego's
  #   bumper until it enters the lane. After that, both hold their speed.
  mode: static_commit
  lc_duration_s: 2.0

# ---- 4 + 5. the actors -------------------------------------------------------
# Relative to the ego: lane left/right/same, offset_m centre to centre along
# the road (+ ahead), speed_mps. One actor holds the cut-in (the best-placed,
# re-cast if it can no longer make it); the rest are traffic that yields to it.
spawn:
  actors:
    - {lane: right, offset_m: 0.0, speed_mps: 12.0}
  # Draw the rest from a seed instead (count includes the explicit ones):
  # count: 4
  # random: {seed: 7, lanes: [left, right], offset_m: [-30, 30], speed_mps: [9, 14]}
