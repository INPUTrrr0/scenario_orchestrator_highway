# Block-cut-in on a straight 3-lane road.
#
# The EGO (green, center lane) wants to change into the RIGHT lane at t=3s.
# The orchestrator casts one fully-autonomous actor as the *blocker* (orange
# dot / "block" tag in the panel): it speeds up so that it is alongside the
# ego in the target lane for the whole lane-change window, denying the gap.
#
# Lanes (northbound, heading 90°): left x=-3.5, center x=0, right x=+3.5
#
# The `block` spec is auto-derived from the ego's first scripted lane_change
# (`block: {}`): window start t = LC start - 1s, duration = LC duration + 2s,
# lat = the LC lateral offset (-3.5 = right lane).  You can also pin it down
# explicitly: block: {t: 2.0, duration: 4.0, along: 0.0, lat: -3.5}
#
# Actor 1 (red) starts 8 m behind the ego in the target lane — the best
# blocker: it accelerates from 11.5 to ~16 m/s to close the gap, holds the
# station through the window, then falls back to cruise.

map:
  kind: straight
  num_lanes: 3
  lane_width: 3.5
  length: 120

render:
  pixels_per_meter: 6

actors:
  # Ego — center lane; wants to merge right at t=3s
  - id: 0
    color: [90, 190, 110]
    length: 4.5
    width: 2.0
    start: {x: 0.0, y: -50.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 3.0, curve: {v0: 12.0, accel: 0.0}}
      - {type: lane_change, duration: 2.0, lateral_offset: -3.5,
         curve: {v0: 12.0, accel: 0.0}}
      - {type: go_straight, duration: 3.0, curve: {v0: 12.0, accel: 0.0}}

  # Blocker candidate — right (target) lane, just behind the ego.
  - id: 1
    color: [210, 70, 60]
    length: 4.5
    width: 2.0
    start: {x: 3.5, y: -58.0, heading: 90}
    cruise: 11.5
    block: {}

  # Nominal traffic — cruise straight unless cast.
  - id: 2
    color: [80, 140, 220]
    length: 4.5
    width: 2.0
    start: {x: -3.5, y: -40.0, heading: 90}
    cruise: 12.0

  - id: 3
    color: [240, 175, 65]
    length: 4.5
    width: 2.0
    start: {x: 3.5, y: -30.0, heading: 90}
    cruise: 12.5

  - id: 4
    color: [170, 110, 220]
    length: 4.5
    width: 2.0
    start: {x: -3.5, y: -62.0, heading: 90}
    cruise: 12.0
