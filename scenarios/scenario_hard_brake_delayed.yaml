# HARD_BRAKE — delayed trigger, so the brake is something you can WATCH.
#
# `scenario_hard_brake.yaml` starts the lead already crawling at 4 m/s from
# t=0. There is no "before": the ego opens its eyes with a slow car in its lane
# and the whole run is the reaction. This variant gives the run a first act.
#
#   t = 0.0 .. 3.0   everyone drives nominally. Ego 12 m/s, lead 11 m/s, so the
#                    gap closes gently (1 m/s) and nothing is happening yet.
#   t = 3.0 .. 4.75  the lead brakes: -4 m/s^2, 11 -> 4 m/s.
#   t = 4.75 ..      the lead holds 4 m/s and the ego has to have decided.
#
# The ego closes on the braking lead at ~8 m/s once it is down to 4, from a gap
# of roughly 15 m at the moment the brake starts, which is a genuine choice
# between braking and moving over rather than a foregone one.
#
# A note on `scripts/scenario_verify.py`
# --------------------------------------
# Its hard_brake SETUP metric wants the brake triggered by PROXIMITY — it fails
# a run where deceleration starts at a longitudinal gap above
# `HARD_BRAKE_TRIGGER_GAP_M` (6 m, +1 m tolerance). This scenario triggers on
# TIME instead, at t=3, and the gap there is ~15 m, so that setup check will
# report "braking started at gap 15 m". That is the scenario disagreeing with
# the metric, not the run going wrong: the runner's own PASS/FAIL verdict
# (no_hit / passed) is computed separately and is unaffected. Use the authored
# `scenario_hard_brake.yaml` when the proximity-triggered staging is what you
# want to measure.
#
# Lanes (heading 90 deg = north): left/adjacent x=-1.75, right/ego x=+1.75

map:
  kind: straight
  num_lanes: 2
  lane_width: 3.5
  length: 160

render:
  pixels_per_meter: 6

actors:
  # Ego — right lane, constant 12 m/s profile (no scripted evasive action).
  # Ignored under `--policy`: the learned ego drives and this is route only.
  - id: 0
    color: [90, 190, 110]
    length: 4.5
    width: 2.0
    start: {x: 1.75, y: -60.0, heading: 90}
    maneuvers:
      - {type: go_straight, duration: 40.0, curve: {v0: 14.0, accel: 0.0}}

  # Slow lead — ego's lane, 18 m ahead. Nominal at 11 m/s for three seconds,
  # then brakes to 4 m/s and stays there.
  - id: 1
    color: [210, 70, 60]
    length: 4.5
    width: 2.0
    # 23 m ahead of the ego, which is IDM's EQUILIBRIUM gap at 14 m/s
    # (s0 + v*T = 2 + 14*1.5). Spawn closer and the follower spends the
    # opening seconds braking to open the gap instead of holding station:
    # at 11 m the ego dropped 14 -> 6 m/s before the lead ever braked, and
    # the brake then landed 28 m away from an ego still recovering. The
    # scenario has to respect the follower's own headway to be a hard
    # brake rather than a spawn transient.
    start: {x: 1.75, y: -37.0, heading: 90}
    role: slow
    autonomy: self
    maneuvers:
      # Matches the ego's 13 m/s, so the ~6 m bumper gap holds steady and the
      # brake is the only thing that changes. Then -8 m/s^2 for 1.5 s: 13 m/s
      # down to 1, an unambiguous emergency stop rather than a drift to a slow
      # cruise. HARD_BRAKE_TRIGGER_GAP_M is 6 m and the staging check wants the
      # brake to start inside it, which is why the lead sits this close.
      # 14 m/s matches configs/policy/idm_highway.yaml's desired_speed_mps.
      # Under an external policy the EGO's authored maneuver is not what
      # drives it -- the policy is -- so a lead cruising faster than the
      # policy's target pulls away and brakes far from the ego. With plain
      # `idm` (8 m/s) the gap at brake onset was 28 m, not the ~6 m the
      # trigger window wants. Run this family with idm_highway or mobil.
      - {type: go_straight, duration: 4.0, curve: {v0: 14.0, accel: 0.0}}
      - {type: decelerate, duration: 1.6, curve: {v0: 14.0, accel: -8.0}}
      - {type: go_straight, duration: 40.0, curve: {v0: 1.0, accel: 0.0}}

  # Normal-speed lead — adjacent lane, 12 m ahead, 10.5 m/s: squeezes the
  # merge gap during the overtake. Unchanged from the authored scenario.
  - id: 2
    color: [240, 175, 65]
    length: 4.5
    width: 2.0
    start: {x: -1.75, y: -48.0, heading: 90}
    role: adjacent
    autonomy: self
    maneuvers:
      - {type: go_straight, duration: 40.0, curve: {v0: 10.5, accel: 0.0}}
