map:
  lane_width: 3.5
  arm_length: 60

render:
  pixels_per_meter: 6

# 8-leg naming: [arm][side], e.g. SE = South arm, East-side lane (inbound,
# northbound); EN = East arm, North-side lane (inbound, westbound).
# Ego (0) drives north out of the South arm; actor 1 drives west out of the
# East arm. Their straight-through paths cross near the intersection center.
actors:
  # Ego vehicle. Spawns on the SE leg, travels straight through heading North.
  - id: 0
    color: [90, 190, 110]          # green
    length: 4.5
    width: 2.0
    start: {x: 1.75, y: -58, heading: 90}
    maneuvers:
      - {type: go_straight, length: 58, duration: 4.0, curve: {slope: 0.25, intercept: 0.0}}
      - {type: go_straight, length: 58, duration: 4.0, curve: {slope: 0.25, intercept: 0.0}}

  # Spawns on the EN leg, travels straight through heading West.
  - id: 1
    color: [210, 70, 60]           # red
    length: 4.5
    width: 2.0
    start: {x: 58, y: 1.75, heading: 180}
    maneuvers:
      - {type: go_straight, length: 58, duration: 4.0, curve: {slope: 0.25, intercept: 0.0}}
      - {type: go_straight, length: 58, duration: 4.0, curve: {slope: 0.25, intercept: 0.0}}
